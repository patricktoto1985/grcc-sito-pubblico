<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dettaglio GP | GRCC F1 ESPORTS</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >

    <style>
        :root {
            --bg-main: #0b0f17;
            --bg-card: #131a26;
            --bg-card-light: #192233;
            --accent: #ffb703;
            --text-light: #ffffff;
            --text-muted: #94a3b8;
            --twitch: #9146ff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;
            background:
                linear-gradient(
                    rgba(11, 15, 23, 0.92),
                    rgba(11, 15, 23, 0.97)
                ),
                url("img/logo.png") center / 45% auto fixed no-repeat;
            color: var(--text-light);
        }

        .gp-page {
            width: min(1200px, calc(100% - 30px));
            margin: 0 auto;
            padding: 30px 0 70px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 25px;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 700;
        }

        .back-link:hover {
            color: var(--accent);
        }

        .gp-hero {
            position: relative;
            overflow: hidden;
            padding: 45px;
            border: 1px solid rgba(255, 183, 3, 0.35);
            border-radius: 20px;
            background:
                linear-gradient(
                    135deg,
                    rgba(26, 35, 54, 0.98),
                    rgba(7, 11, 18, 0.98)
                );
            box-shadow: 0 20px 55px rgba(0, 0, 0, 0.55);
        }

        .gp-hero::before {
            content: "";
            position: absolute;
            width: 360px;
            height: 360px;
            top: -180px;
            right: -100px;
            border-radius: 50%;
            background: rgba(255, 183, 3, 0.12);
            filter: blur(20px);
        }

        .gp-round {
            display: inline-block;
            padding: 7px 12px;
            border-radius: 5px;
            background: var(--accent);
            color: #000;
            font-size: 0.8rem;
            font-weight: 900;
            text-transform: uppercase;
        }

        .gp-title {
            position: relative;
            margin: 18px 0 8px;
            font-size: clamp(2.2rem, 7vw, 4.6rem);
            line-height: 1;
            text-transform: uppercase;
        }

        .gp-circuit {
            position: relative;
            margin: 0;
            color: var(--text-muted);
            font-size: 1.15rem;
        }

        .gp-meta {
            position: relative;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 28px;
        }

        .gp-meta-item {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 11px 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 9px;
            background: rgba(255, 255, 255, 0.035);
            color: #d9e1ec;
        }

        .gp-meta-item i {
            color: var(--accent);
        }

        .gp-grid {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 24px;
            margin-top: 28px;
        }

        .gp-card {
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            background: var(--bg-card);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.28);
        }

        .gp-card h2 {
            margin: 0 0 20px;
            font-size: 1.3rem;
            text-transform: uppercase;
        }

        .gp-card h2 span {
            color: var(--accent);
        }

        .podium {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            align-items: end;
        }

        .podium-place {
            padding: 20px 12px;
            border-radius: 12px;
            text-align: center;
            background: var(--bg-card-light);
            border: 1px solid rgba(255, 255, 255, 0.07);
        }

        .podium-place.first {
            padding-top: 32px;
            border-color: rgba(255, 183, 3, 0.55);
        }

        .podium-position {
            display: block;
            margin-bottom: 8px;
            color: var(--accent);
            font-size: 1.7rem;
            font-weight: 900;
        }

        .podium-driver {
            display: block;
            color: #fff;
            font-weight: 900;
        }

        .podium-team {
            display: block;
            margin-top: 5px;
            color: var(--text-muted);
            font-size: 0.82rem;
        }

        .result-list {
            display: grid;
            gap: 12px;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            padding: 13px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.07);
        }

        .result-row:last-child {
            border-bottom: 0;
        }

        .result-label {
            color: var(--text-muted);
        }

        .result-value {
            color: #fff;
            font-weight: 800;
            text-align: right;
        }

        .race-note {
            padding: 14px;
            border-left: 4px solid var(--accent);
            border-radius: 0 8px 8px 0;
            background: rgba(255, 183, 3, 0.06);
            color: #dbe3ef;
            line-height: 1.55;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            border-radius: 12px;
            background: #000;
        }

        .video-wrapper iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .video-unavailable {
            display: flex;
            height: 100%;
            min-height: 280px;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 10px;
            color: var(--text-muted);
        }

        .video-unavailable i {
            font-size: 2.3rem;
        }

        .loading,
        .error-message {
            padding: 70px 20px;
            text-align: center;
            color: var(--text-muted);
        }

        .error-message {
            color: #ff7373;
        }

        @media (max-width: 850px) {
            .gp-grid {
                grid-template-columns: 1fr;
            }

            .gp-hero {
                padding: 30px 22px;
            }

            .podium {
                grid-template-columns: 1fr;
            }

            .podium-place.first {
                order: -1;
            }
        }
    </style>
</head>

<body>

    <main class="gp-page">

        <a href="index.html" class="back-link">
            <i class="fas fa-arrow-left"></i>
            Torna alla home
        </a>

        <div id="gpContent" class="loading">
            <i class="fas fa-spinner fa-spin"></i>
            Caricamento Gran Premio...
        </div>

    </main>

    <script>
        const championshipRaces = [
            {
                round: 1,
                country: "Australia",
                circuit: "Albert Park",
                date: "15 Marzo 2026",
                status: "completed",
                winner: "SICKMIRKO",
                pole: "Da inserire",
                fastestLap: "Da inserire",
                second: "Da inserire",
                third: "Da inserire",
                winnerTeam: "Ferrari",
                secondTeam: "",
                thirdTeam: "",
                notes: "Nessuna comunicazione disponibile."
            },

            {
                round: 2,
                country: "Cina",
                circuit: "Shanghai",
                date: "29 Marzo 2026",
                status: "next",
                winner: "Da disputare",
                pole: "Da disputare",
                fastestLap: "Da disputare",
                second: "Da disputare",
                third: "Da disputare",
                winnerTeam: "",
                secondTeam: "",
                thirdTeam: "",
                notes: "Gara non ancora disputata."
            }
        ];

        const GOOGLE_SHEET_ID =
            "1oZJvdapQMAWUMNP7tujD2r2IubN3DjC5vjufjSYELUc";

        function getRoundFromUrl() {
            const params = new URLSearchParams(window.location.search);
            return Number(params.get("round"));
        }

        function extractTwitchClipId(url) {
            if (!url) {
                return "";
            }

            const cleanUrl = url
                .split("?")[0]
                .replace(/\/$/, "");

            if (cleanUrl.includes("clips.twitch.tv/")) {
                return cleanUrl
                    .split("clips.twitch.tv/")
                    .pop();
            }

            if (cleanUrl.includes("/clip/")) {
                return cleanUrl
                    .split("/clip/")
                    .pop();
            }

            return "";
        }

        async function loadHighlightForRound(round) {
            const sheetName = "Highlights";

            const url =
                "https://docs.google.com/spreadsheets/d/" +
                GOOGLE_SHEET_ID +
                "/gviz/tq?tqx=out:json&sheet=" +
                encodeURIComponent(sheetName);

            try {
                const response = await fetch(url);

                if (!response.ok) {
                    return "";
                }

                const text = await response.text();

                const jsonText = text.substring(
                    text.indexOf("{"),
                    text.lastIndexOf("}") + 1
                );

                const json = JSON.parse(jsonText);
                const rows = json.table.rows || [];

                let highlightUrl = "";

                rows.forEach((row) => {
                    if (!row || !row.c) {
                        return;
                    }

                    const rowRound =
                        row.c[0] && row.c[0].v !== null
                            ? Number(row.c[0].v)
                            : 0;

                    const videoUrl =
                        row.c[3] && row.c[3].v
                            ? String(row.c[3].v).trim()
                            : "";

                    if (rowRound === round && videoUrl) {
                        highlightUrl = videoUrl;
                    }
                });

                return highlightUrl;

            } catch (error) {
                console.error(
                    "Errore caricamento highlight:",
                    error
                );

                return "";
            }
        }

        function statusLabel(status) {
            if (status === "completed") {
                return "Gara disputata";
            }

            if (status === "next") {
                return "Prossima gara";
            }

            return "Gara futura";
        }

        function renderGpPage(race, highlightUrl) {
            const content =
                document.getElementById("gpContent");

            const clipId =
                extractTwitchClipId(highlightUrl);

            let videoHtml = `
                <div class="video-unavailable">
                    <i class="fas fa-video-slash"></i>
                    <strong>Highlights non disponibili</strong>
                </div>
            `;

            if (clipId) {
                videoHtml = `
                    <iframe
                        src="https://clips.twitch.tv/embed?clip=${encodeURIComponent(clipId)}&parent=patricktoto1985.github.io&autoplay=false"
                        allowfullscreen
                        scrolling="no"
                        title="Highlights ${race.country}"
                    ></iframe>
                `;
            }

            content.className = "";

            content.innerHTML = `
                <section class="gp-hero">
                    <span class="gp-round">
                        ${statusLabel(race.status)} · Round ${race.round}
                    </span>

                    <h1 class="gp-title">
                        ${race.country}
                    </h1>

                    <p class="gp-circuit">
                        ${race.circuit}
                    </p>

                    <div class="gp-meta">
                        <div class="gp-meta-item">
                            <i class="far fa-calendar-alt"></i>
                            ${race.date}
                        </div>

                        <div class="gp-meta-item">
                            <i class="fas fa-flag-checkered"></i>
                            Round ${race.round}
                        </div>

                        <div class="gp-meta-item">
                            <i class="fas fa-trophy"></i>
                            ${race.winner}
                        </div>
                    </div>
                </section>

                <div class="gp-grid">

                    <section class="gp-card">
                        <h2>Podio <span>ufficiale</span></h2>

                        <div class="podium">
                            <div class="podium-place">
                                <span class="podium-position">2°</span>
                                <span class="podium-driver">
                                    ${race.second}
                                </span>
                                <span class="podium-team">
                                    ${race.secondTeam || "—"}
                                </span>
                            </div>

                            <div class="podium-place first">
                                <span class="podium-position">1°</span>
                                <span class="podium-driver">
                                    ${race.winner}
                                </span>
                                <span class="podium-team">
                                    ${race.winnerTeam || "—"}
                                </span>
                            </div>

                            <div class="podium-place">
                                <span class="podium-position">3°</span>
                                <span class="podium-driver">
                                    ${race.third}
                                </span>
                                <span class="podium-team">
                                    ${race.thirdTeam || "—"}
                                </span>
                            </div>
                        </div>
                    </section>

                    <aside class="gp-card">
                        <h2>Dati della <span>gara</span></h2>

                        <div class="result-list">
                            <div class="result-row">
                                <span class="result-label">
                                    Pole position
                                </span>
                                <span class="result-value">
                                    ${race.pole}
                                </span>
                            </div>

                            <div class="result-row">
                                <span class="result-label">
                                    Giro più veloce
                                </span>
                                <span class="result-value">
                                    ${race.fastestLap}
                                </span>
                            </div>

                            <div class="result-row">
                                <span class="result-label">
                                    Vincitore
                                </span>
                                <span class="result-value">
                                    ${race.winner}
                                </span>
                            </div>
                        </div>
                    </aside>

                    <section class="gp-card">
                        <h2>Highlights <span>Twitch</span></h2>

                        <div class="video-wrapper">
                            ${videoHtml}
                        </div>
                    </section>

                    <aside class="gp-card">
                        <h2>Race <span>Control</span></h2>

                        <div class="race-note">
                            ${race.notes}
                        </div>
                    </aside>

                </div>
            `;
        }

        async function initialiseGpPage() {
            const round = getRoundFromUrl();

            if (!round) {
                document.getElementById("gpContent").innerHTML = `
                    <div class="error-message">
                        Round non specificato.
                    </div>
                `;

                return;
            }

            const race =
                championshipRaces.find(
                    (item) => item.round === round
                );

            if (!race) {
                document.getElementById("gpContent").innerHTML = `
                    <div class="error-message">
                        Gran Premio non trovato.
                    </div>
                `;

                return;
            }

            const highlightUrl =
                await loadHighlightForRound(round);

            renderGpPage(race, highlightUrl);
        }

        initialiseGpPage();
    </script>

</body>
</html>
